name: Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (macOS ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew install nlohmann-json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install numpy

      - name: Build Engine & Run C++ Unit Tests
        run: |
          make test

      - name: Run Fast Synthetic E2E Regression Test
        run: |
          make test_synthetic
